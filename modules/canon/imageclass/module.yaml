id: canon-imageclass
version: 0.2.3
vendor: Canon
family: imageCLASS MF
models: [MF642C, MF643C, MF644C, MF650C Series]    # as the printers name themselves; the MF642C/643C/644C share one Remote UI
windows_names: ["Canon MF642C*", "Canon MF643C*", "Canon MF644C*", "Canon MF640C*", "Canon MF650C*", "Canon MF651C*", "Canon MF652C*", "Canon MF653C*", "Canon MF654C*", "Canon MF655C*", "Canon MF656C*", "Canon MF657C*"]
status: official
sdk_version: 1
app_versions:
  min: 0.2.3
adapter: ScanRelay.Modules.CanonImageClass.dll
unofficial: true
method: >-
  Signs in to the printer's Remote UI as System Manager and loads a whole address book onto
  it. Canon does not document this, and a firmware update can change the pages it relies on.
  The printer refuses a load for some minutes after an export, so the address book is read
  once, with the button on the Printers page, and every push is built from that copy. Before
  reading, make one shared folder entry on the printer by hand, named exactly "ScanRelay",
  with the printer account and its password: the printer stores passwords in a form only it
  can read, and the module copies that entry's stored password onto the entries it creates.
  The first push takes the "ScanRelay" entry off the printer again.
scan:
  protocols: [smb]
  smb_versions: ["2.0", "3.0"]      # confirm per model
  share_rights: [create, write]
address_book:
  max_entries: null                 # not known yet
  one_touch: false
prerequisites: []
tested_firmware: ["10.05"]          # MF642C main controller. An MF650C Series was read and loaded too; its firmware version was not recorded
options:
  secure: "true"                    # false talks plain HTTP
  template_name: "ScanRelay"
  address_book_pin: ""
