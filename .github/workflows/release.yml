name: Release

# A release is built here, from the public repo, and nowhere else.
# It stops for approval if the release environment asks for one, then publishes a draft.
# Started by hand from the Actions page. It releases the version in Directory.Build.props from the
# chosen branch. Publishing the draft creates the tag, so a tag must not start it a second time.
on:
  workflow_dispatch:

permissions:
  contents: write

# Never at the same time as "Publish modules": both write to releases.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    # The "release" environment holds the signing key and names who must approve.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $inCode = "$($props.Project.PropertyGroup.Version)".Trim()
          gh release view "v$inCode" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Version $inCode has already been released. Raise the version in Directory.Build.props first." }
          $global:LASTEXITCODE = 0
          "VERSION=$inCode" >> $env:GITHUB_ENV

      - name: Check the signing key
        shell: pwsh
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          $hasSecret = [bool]$env:MODULE_SIGNING_KEY
          $hasPublic = Test-Path catalog/signing-key.pub.pem
          if ($hasSecret -and $hasPublic) {
            dotnet run --project tools/ModuleTool --configuration Release -- key-matches catalog/signing-key.pub.pem
            if ($LASTEXITCODE -ne 0) { throw "The signing key does not match the public key the app is built to trust." }
            "SIGNED=true" >> $env:GITHUB_ENV
          }
          else {
            # Without both halves of the key, modules cannot be official. The release still goes out,
            # says so plainly, and its modules install as custom, from a file.
            Write-Host "::warning::Modules in this release are NOT signed: secret present = $hasSecret, public key in repo = $hasPublic. See docs/releasing.md."
            "SIGNED=false" >> $env:GITHUB_ENV
          }

      - name: Build and test
        run: |
          dotnet build ScanRelay.slnx --configuration Release
          dotnet test ScanRelay.slnx --configuration Release --no-build

      - name: Publish the service
        run: dotnet publish src/Service --configuration Release --runtime win-x64 --self-contained --output artifacts/service

      - name: Build the installer
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/service/* -DestinationPath artifacts/payload.zip
          $payload = (Resolve-Path artifacts/payload.zip).Path
          dotnet publish src/Installer --configuration Release --runtime win-x64 --self-contained -p:PublishSingleFile=true -p:PayloadZip="$payload" --output artifacts/installer
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item artifacts/installer/ScanRelaySetup.exe "release/ScanRelaySetup-$env:VERSION.exe"

      - name: Package, sign and index the modules
        shell: pwsh
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          $tool = "tools/ModuleTool"
          ./build/pack-modules.ps1 -Out release
          if ($env:SIGNED -eq "true") {
            Get-ChildItem release -Filter *.srmod | ForEach-Object {
              dotnet run --project $tool --configuration Release --no-build -- sign $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing $($_.Name) failed." }
            }
            dotnet run --project $tool --configuration Release --no-build -- index release
            if ($LASTEXITCODE -ne 0) { throw "Writing the module index failed." }
          }

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt

      - name: Publish a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw "Write the release notes and update steps in $notes first. See docs/releasing.md." }
          Copy-Item $notes release-notes.md
          if ($env:SIGNED -ne "true") {
            Add-Content release-notes.md "`n## Modules in this release are not signed`n`nThe project's signing key was not in place when this release was built. The installer therefore lists no modules from GitHub. Download the module file (.srmod) from this release and add it in the installer's Modules step as a custom module from a file."
          }
          gh release create "v$env:VERSION" (Get-ChildItem release -File).FullName --draft --target "${{ github.sha }}" --title "$env:VERSION" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }
