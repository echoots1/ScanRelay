name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ScanRelay.slnx
      - name: Build
        run: dotnet build ScanRelay.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ScanRelay.slnx --configuration Release --no-build
      - name: Publish the service for Windows
        if: matrix.os == 'windows-latest'
        run: dotnet publish src/Service --configuration Release --runtime win-x64 --self-contained --output publish/service
      - name: Keep the published service
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: scanrelay-service-win-x64
          path: publish/service
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
