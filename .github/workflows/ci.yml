name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore ScanRelay.slnx
      - name: Build
        run: dotnet build ScanRelay.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ScanRelay.slnx --configuration Release --no-build
      - name: Publish the service for Windows
        if: matrix.os == 'windows-latest'
        run: dotnet publish src/Service --configuration Release --runtime win-x64 --self-contained --output publish/service
      - name: Keep the published service
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: scanrelay-service-win-x64
          path: publish/service
          retention-days: 14

  install:
    name: Install, check and uninstall on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the installer with the service inside it
        shell: pwsh
        run: |
          dotnet publish src/Service --configuration Release --runtime win-x64 --self-contained --output artifacts/service
          Compress-Archive -Path artifacts/service/* -DestinationPath artifacts/payload.zip
          $payload = (Resolve-Path artifacts/payload.zip).Path
          dotnet publish src/Installer/ScanRelay.Installer.csproj --configuration Release --output artifacts/installer -p:PayloadZip="$payload"
          if ($LASTEXITCODE -ne 0) { throw "Publishing the installer failed." }
      - name: Package the sample module as a custom module
        shell: pwsh
        run: |
          dotnet publish modules/scanrelay/sample --configuration Release --output artifacts/sample
          dotnet run --project tools/ModuleTool --configuration Release -- pack artifacts/sample artifacts/modules
          if ($LASTEXITCODE -ne 0) { throw "Packing the sample module failed." }
      - name: Install silently, check everything the installer promises, repair, uninstall
        shell: pwsh
        run: pwsh tests/windows/Test-Install.ps1 -Setup artifacts/installer/ScanRelaySetup.exe -Module (Get-ChildItem artifacts/modules/*.srmod).FullName
      - name: Keep the installer and its log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            artifacts/installer/ScanRelaySetup.exe
            C:/ProgramData/ScanRelay-setup.log
          retention-days: 14

  browser:
    name: Admin screen in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Build
        run: dotnet build tests/DevHarness --configuration Release
      - name: Start the app with a mock Microsoft 365 and a mock printer
        run: |
          nohup dotnet run --project tests/DevHarness --configuration Release --no-build > harness.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 1; done
      - name: Walk through setup, a sync, a scan, a failure and the roles
        run: node tests/e2e/admin-screen.mjs screenshots
      - name: Keep the screenshots and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-screen
          path: |
            screenshots
            harness.log
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
